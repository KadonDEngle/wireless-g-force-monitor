<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wireless G-Force Monitor</title>
  <style>
    :root {
      --osu-orange: #DC4405;
      --bg-dark: #111111;
      --card-bg: #1B1B1D;
      --card-border: #2D2D30;
      --text-main: #FFFFFF;
      --text-muted: #A1A1AA;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1.25rem;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at top center, rgba(220, 68, 5, 0.16) 0%, transparent 55%);
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      margin: 0 0 2rem;
      font-size: clamp(1.75rem, 6vw, 2.4rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      width: 100%;
    }

    a.card {
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-top: 3px solid var(--osu-orange);
      border-radius: 12px;
      padding: 1.75rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    a.card:hover,
    a.card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--osu-orange);
      box-shadow: 0 10px 24px rgba(220, 68, 5, 0.18);
      outline: none;
    }

    .card h2 {
      margin: 0 0 0.35rem;
      font-size: 1.25rem;
    }

    .card p {
      margin: 0 0 1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
    }

    .tag.ai {
      color: #FDBA74;
      border-color: rgba(220, 68, 5, 0.4);
      background: rgba(220, 68, 5, 0.1);
    }

    .note {
      margin: 1.75rem 0 0;
      font-size: 0.82rem;
      color: #71717A;
      line-height: 1.4;
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Wireless G-Force Monitor</h1>

    <div class="cards">
      <a class="card" href="./jonathan/">
        <h2>Interface A</h2>
        <p>Jonathan's Web App</p>
        <span class="tag">Hand-Coded</span>
      </a>

      <a class="card" href="./kadon/">
        <h2>Interface B</h2>
        <p>Kadon's Web App</p>
        <span class="tag ai">AI-Assisted</span>
      </a>
    </div>

    <p class="note">
      Requires Web Bluetooth &amp; Web Serial support (Chrome or Edge).
    </p>
  </main>
</body>
</html>
